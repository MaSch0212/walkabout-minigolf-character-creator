<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkabout Avatar Creator</title>
<style>
  :root {
    --bg: #eef2f6; --panel: #ffffff; --panel-2: #f5f7fa; --text: #1c2430; --muted: #6a7686;
    --line: #dde3ea; --accent: #1f7ae0; --accent-soft: #e3effd; --card: #f7f9fb; --shadow: 0 1px 3px rgba(20,30,50,.08);
    --sky-1: #bfe3ff; --sky-2: #f3f9ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --panel: #1a2029; --panel-2: #202833; --text: #e6ebf2; --muted: #93a0b2;
      --line: #2c3542; --accent: #4c9dff; --accent-soft: #1d3350; --card: #222a35; --shadow: none;
      --sky-1: #1e3550; --sky-2: #121821;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1a2029; --panel-2: #202833; --text: #e6ebf2; --muted: #93a0b2;
    --line: #2c3542; --accent: #4c9dff; --accent-soft: #1d3350; --card: #222a35; --shadow: none;
    --sky-1: #1e3550; --sky-2: #121821;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 440px; height: 100vh; }
  #viewer { position: relative; background: linear-gradient(180deg, var(--sky-1), var(--sky-2)); overflow: hidden; }
  #viewer canvas { display: block; width: 100%; height: 100%; }
  .bar { position: absolute; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .bar.top { top: 12px; }
  .bar.bottom { bottom: 12px; }
  h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: .2px; background: var(--panel);
    padding: 7px 12px; border-radius: 10px; box-shadow: var(--shadow); }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 12px; cursor: pointer; box-shadow: var(--shadow); }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 6px 10px; box-shadow: var(--shadow); cursor: pointer; user-select: none; }
  .spacer { flex: 1; }
  #panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-radius: 0; box-shadow: none; background: transparent; padding: 12px 8px;
    font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 4px; }
  #chips button { padding: 4px 10px; border-radius: 99px; font-size: 13px; box-shadow: none; background: var(--panel-2); }
  #chips button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #chips button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: middle; }
  #extras { padding: 6px 12px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #extras:empty { display: none; }
  #swatches { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 8px; }
  #swatches:empty { padding: 0; }
  #swatches .title { width: 100%; font-size: 12px; color: var(--muted); }
  .sw { width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--line); cursor: pointer; padding: 0; box-shadow: none; }
  .sw.active { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
  #grid { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 10px; align-content: start; }
  .card { position: relative; background: var(--card); border: 2px solid transparent; border-radius: 12px; padding: 6px 6px 8px;
    cursor: pointer; text-align: center; transition: border-color .1s; }
  .card:hover { border-color: var(--line); }
  .card.sel { border-color: var(--accent); background: var(--accent-soft); }
  .card .th { width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .card .ph { width: 38%; aspect-ratio: 1; border-radius: 50%; background: var(--line); opacity: .5; }
  .card .none { font-size: 34px; color: var(--muted); }
  .card .lb { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sb { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 15px; }
  .card .dl { position: absolute; top: 4px; right: 4px; padding: 3px 6px; font-size: 12px; line-height: 1; border-radius: 7px;
    opacity: 0; transition: opacity .1s; }
  .card:hover .dl, .card.sel .dl { opacity: 1; }
  @media (hover: none) { .card .dl { opacity: 1; } }
  #status { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); background: var(--panel); padding: 8px 14px;
    border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; font-size: 15px; color: var(--muted); }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    #panel { border-left: 0; border-top: 1px solid var(--line); }
    #grid { max-height: 70vh; }
    h1 { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading models…</div>
<div id="app">
  <section id="viewer">
    <div class="bar top">
      <h1>Walkabout Avatar Creator</h1>
      <select id="preset" title="Presets"></select>
      <button id="random" title="Random avatar">Randomize</button>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="showExtras" checked> Show putter &amp; ball</label>
    </div>
    <div id="status"></div>
    <div class="bar bottom">
      <select id="format" title="Download format">
        <option value="3mf">3MF (colors embedded)</option>
        <option value="obj">OBJ (vertex colors)</option>
      </select>
      <label class="chk"><input type="checkbox" id="includeExtras"> Include putter &amp; ball</label>
      <span class="spacer"></span>
      <button class="primary" id="dlChar">Download character</button>
    </div>
  </section>
  <aside id="panel">
    <div class="tabs">
      <button data-tab="avatar" class="active">Avatar</button>
      <button data-tab="putter">Putter</button>
      <button data-tab="ball">Ball</button>
    </div>
    <div id="chips"></div>
    <div id="extras"></div>
    <div id="swatches"></div>
    <div id="grid"></div>
  </aside>
</div>
<script src="data/bundle.js"></script>
<script type="module">
// Walkabout Mini Golf avatar creator — three.js viewer, part picker and single-file 3MF/OBJ export.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const META = window.WMG_META;
const BIN = b64ToBytes(window.WMG_GEOMETRY_B64);
window.WMG_GEOMETRY_B64 = null;
const STEP = META.variantStep / META.atlasSize;   // one colour variant = 16 px to the right in the palette atlas

const CATS = ['model', 'head', 'eyes', 'eyebrows', 'eyelashes', 'hair', 'hat', 'glasses', 'beard', 'mouth', 'makeup', 'outfit', 'accessories'];
const CAT_LABEL = { model: 'Model', head: 'Head', eyes: 'Eyes', eyebrows: 'Eyebrows', eyelashes: 'Lashes', hair: 'Hair', hat: 'Hat',
  glasses: 'Glasses', beard: 'Beard', mouth: 'Mouth', makeup: 'Makeup', outfit: 'Outfit', accessories: 'Accessories' };
const REQUIRED = new Set(['head']);
// the avatar from the screenshot: [type, id, colour]
const CAPTAIN = [[0, 1, 0], [1, 0, 1], [5, 0, 0], [8, 28, 0], [6, 7, 0], [2, 4, 8], [9, 2, 0]];
// Player-card layout: putter held upside down on the left (club head up, pointing at the avatar),
// ball at the lower left in front of the hoodie. Values measured from a VRFamilie player card.
const PUTTER_LAYOUT = { shaftX: -0.244, shaftTop: 0.407, z: 0.02, scale: 0.88 };
const PUTTER_TILT = THREE.MathUtils.degToRad(192.3);   // turns the ~12° leaning shaft vertical, grip down
const BALL_POS = new THREE.Vector3(-0.11, -0.28, 0.2);
const BALL_SCALE = 1.4;
function placePutter(obj) {
  obj.rotation.set(0, Math.PI, PUTTER_TILT, 'ZYX');   // turn around (club head faces right), then flip upside down
  obj.scale.setScalar(PUTTER_LAYOUT.scale);
  obj.position.set(0, 0, 0);
  obj.updateMatrixWorld(true);
  const shaft = obj.children.find(c => c.name.startsWith('shaft_')) || obj;
  const b = new THREE.Box3().setFromObject(shaft);
  obj.position.set(PUTTER_LAYOUT.shaftX - (b.min.x + b.max.x) / 2, PUTTER_LAYOUT.shaftTop - b.max.y, PUTTER_LAYOUT.z);
  return obj;
}
function placeBall(obj) { obj.position.copy(BALL_POS); obj.scale.setScalar(BALL_SCALE); return obj; }

// ---------------------------------------------------------------- data helpers
function b64ToBytes(s) {
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
const f32 = e => new Float32Array(BIN.buffer, e[0], e[1]);
const idx = m => (m.i32 ? new Uint32Array(BIN.buffer, m.i[0], m.i[1]) : new Uint16Array(BIN.buffer, m.i[0], m.i[1]));
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const parts = META.parts.map((p, k) => ({ ...p, k }));
const partsByModel = {};
for (const p of parts) (partsByModel[p.model] ||= []).push(p);
const models = [...META.models].sort((a, b) => a.id - b.id);
const modelByKey = Object.fromEntries(models.map(m => [m.key, m]));

const pretty = s => s.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase());
function modelLabel(m) {
  if (m.key === 'model_1') return 'Human';
  if (m.tag) return pretty(m.tag);
  return (m.pack || 'Model') + ' ' + m.id;
}
function partLabel(p) {
  const num = (p.name.match(/_(\d+)/) || [])[1];
  const style = (p.name.match(/_\d+_([a-z]+)/) || [])[1];
  return `${CAT_LABEL[p.cat] || p.cat} ${num != null ? parseInt(num, 10) : ''}${style ? ' · ' + style : ''}`;
}

// ---------------------------------------------------------------- textures & pixel sampling
const loadImage = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const [atlasImg, ballImg, atlasMrImg, atlasEmImg, ballMrImg, ballEmImg, ballNrmImg] = await Promise.all(
  [window.WMG_ATLAS, window.WMG_BALLTEX, window.WMG_ATLAS_MR, window.WMG_ATLAS_EMISSIVE, window.WMG_BALL_MR, window.WMG_BALL_EMISSIVE, window.WMG_BALL_NORMAL].map(loadImage));
function makeTex(img, nearest, data = false) {
  const t = new THREE.Texture(img);
  t.colorSpace = data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.magFilter = t.minFilter = nearest ? THREE.NearestFilter : THREE.LinearFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
// Game materials: metal maps are repacked at build time (G = 1 - smoothness, B = metallic), see tools/build_data.py.
// Avatar parts + putters: Avatar_Putter_Combined (metallic = map, smoothness = map alpha, emission map).
// Balls: Ball_Material (same packing, emission map, dimple normal map on the sphere unwrap = uv1).
const MAT = META.materials;
const atlasTex = makeTex(atlasImg, true), ballTex = makeTex(ballImg, false);
const atlasMR = makeTex(atlasMrImg, true, true), atlasEm = makeTex(atlasEmImg, true);
const ballMR = makeTex(ballMrImg, false, true), ballEm = makeTex(ballEmImg, false);
const ballNrm = makeTex(ballNrmImg, false, true);
ballNrm.channel = 1;
const matAtlas = new THREE.MeshStandardMaterial({ map: atlasTex, flatShading: true,
  metalnessMap: atlasMR, metalness: MAT.avatar.metalness, roughnessMap: atlasMR, roughness: 1,
  emissiveMap: atlasEm, emissive: 0xffffff, emissiveIntensity: MAT.avatar.emissiveIntensity });
const matBall = new THREE.MeshStandardMaterial({ map: ballTex,
  metalnessMap: ballMR, metalness: 1, roughnessMap: ballMR, roughness: 1,
  emissiveMap: ballEm, emissive: 0xffffff, emissiveIntensity: MAT.ball.emissiveIntensity,
  normalMap: ballNrm, normalScale: new THREE.Vector2(MAT.ball.normalScale, MAT.ball.normalScale) });

const pixCache = {};
function pixels(which) {
  if (pixCache[which]) return pixCache[which];
  const img = which === 'ball' ? ballImg : atlasImg;
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0);
  return (pixCache[which] = { w: c.width, h: c.height, d: x.getImageData(0, 0, c.width, c.height).data });
}
function sample(P, u, v) {
  const x = Math.min(P.w - 1, Math.max(0, Math.floor(u * P.w)));
  const y = Math.min(P.h - 1, Math.max(0, Math.floor((1 - v) * P.h)));
  const i = (y * P.w + x) * 4;
  return [P.d[i], P.d[i + 1], P.d[i + 2]];
}

// ---------------------------------------------------------------- geometry builders
function buildGeometry(mesh, { variant = 0, shape = null, smooth = false } = {}) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(shape ? f32(shape) : f32(mesh.p), 3));
  const uv = f32(mesh.uv).slice();
  if (variant) for (let i = 0; i < uv.length; i += 2) uv[i] += variant * STEP;
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(new THREE.BufferAttribute(idx(mesh), 1));
  if (mesh.uv0) g.setAttribute('uv1', new THREE.BufferAttribute(f32(mesh.uv0), 2));   // balls: sphere unwrap for the normal map
  if (smooth) g.computeVertexNormals();
  return g;
}
function partMesh(part, variant = part.color, blend = '') {
  const shape = blend && part.cat !== 'hat' ? part.shapes[blend] : null;   // hair/glasses squash under caps & visors
  const m = new THREE.Mesh(buildGeometry(part.mesh, { variant, shape }), matAtlas);
  m.name = part.name; m.userData.pix = 'atlas';
  return m;
}
function avatarGroup(equip) {
  const g = new THREE.Group();
  const blend = equip.hat?.part.blend || '';
  for (const cat of CATS) {
    const e = equip[cat];
    if (e && e.part) g.add(partMesh(e.part, e.variant, blend));
  }
  return g;
}
function putterGroup(id, opts = {}) {
  const def = META.putters.find(p => p.id === id) || META.putters[0];
  const g = new THREE.Group();
  const names = def.parts.filter(n => opts.hand !== false || !n.startsWith('hand_'));
  for (const n of [...names, ...(opts.addons || [])]) {
    const geo = buildGeometry(META.putterParts[n]);
    if (opts.skin && n.startsWith('hand_')) {
      // the glove is one flat palette colour: point all its UVs at the avatar's skin texel instead
      const uv = geo.attributes.uv.array;
      for (let i = 0; i < uv.length; i += 2) { uv[i] = opts.skin[0]; uv[i + 1] = opts.skin[1]; }
    }
    const m = new THREE.Mesh(geo, matAtlas);
    m.name = n; m.userData.pix = 'atlas'; g.add(m);
  }
  return g;
}
function ballMesh(i) {
  const b = META.balls[i];
  const m = new THREE.Mesh(buildGeometry(b.mesh, { smooth: true }), matBall);
  m.name = b.name; m.userData.pix = 'ball';
  return m;
}
function disposeTree(o) { o.traverse(c => { if (c.geometry) c.geometry.dispose(); }); }

// ---------------------------------------------------------------- state
const variantMemory = new Map();   // part.k -> last chosen colour
const state = { tab: 'avatar', cat: 'model', model: 'model_1', equip: {}, putter: '0', ball: 0,
  addons: new Set(), hand: true, skinHand: true, format: '3mf' };

// UV of the equipped head's main colour (its most used palette texel) in the chosen colour variant
function skinUV() {
  const e = state.equip.head;
  if (!state.skinHand || !e) return null;
  const p = e.part;
  if (!p._skin) {
    const uv = f32(p.mesh.uv), cnt = new Map();
    let best = null, bestN = 0;
    for (let i = 0; i < uv.length; i += 2) {
      const k = Math.floor(uv[i] * META.atlasSize) + ',' + Math.floor(uv[i + 1] * META.atlasSize);
      const n = (cnt.get(k) || 0) + 1; cnt.set(k, n);
      if (n > bestN) { bestN = n; best = [uv[i], uv[i + 1]]; }
    }
    p._skin = best;
  }
  return [p._skin[0] + e.variant * STEP, p._skin[1]];
}
const skinKey = () => { const s = skinUV(); return s ? s[0].toFixed(5) + ',' + s[1].toFixed(5) : 'glove'; };
const putterOpts = (id, extra = {}) => ({ hand: state.hand, skin: skinUV(), addons: id === state.putter ? [...state.addons] : [], ...extra });

function defaultEquip(modelKey) {
  const list = partsByModel[modelKey] || [];
  const byCat = {};
  for (const p of list) (byCat[p.cat] ||= []).push(p);
  const eq = {};
  const pick = (cat, name, v) => { const p = (byCat[cat] || []).find(x => x.name === name) || (byCat[cat] || [])[0]; if (p) eq[cat] = { part: p, variant: v ?? p.color }; };
  if (modelKey === 'model_1') {
    pick('head', 'head_00', 1); pick('eyes', 'eyes_00'); pick('eyebrows', 'eyebrows_00'); pick('hair', 'hair_00'); pick('outfit', 'outfit_00');
  } else {
    for (const [cat, arr] of Object.entries(byCat)) if (arr.length === 1 || ['head', 'eyes', 'mouth'].includes(cat)) pick(cat);
  }
  return eq;
}
function equipFromOptions(opts) {
  const mo = opts.find(o => o[0] === 0);
  const model = models.find(m => m.id === (mo ? mo[1] : 1)) || modelByKey.model_1;
  const eq = {};
  for (const [t, i, v] of opts) {
    if (t === 0) continue;
    const p = (partsByModel[model.key] || []).find(x => x.type === t && x.id === i);
    if (p) eq[p.cat] = { part: p, variant: Math.min(v, Math.max(0, p.colors - 1)) };
  }
  if (!eq.head) Object.assign(eq, { head: defaultEquip(model.key).head });
  return { model: model.key, equip: eq };
}

// ---------------------------------------------------------------- main viewer
const viewer = $('#viewer');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewer.prepend(renderer.domElement);
const scene = new THREE.Scene();
function addLights(s) {
  s.add(new THREE.HemisphereLight(0xffffff, 0x8a96a8, 1.1));
  const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(1.2, 2, 2.5); s.add(d);
  const d2 = new THREE.DirectionalLight(0xffffff, 0.5); d2.position.set(-2, 0.5, -1); s.add(d2);
}
addLights(scene);
// reflections for metallic parts; kept low because the environment also lights non-metals
const ENV_INTENSITY = 0.65;
const envFor = r => { const pm = new THREE.PMREMGenerator(r); const t = pm.fromScene(new RoomEnvironment(), 0.04).texture; pm.dispose(); return t; };
scene.environment = envFor(renderer); scene.environmentIntensity = ENV_INTENSITY;
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
camera.position.set(0.35, 0.05, 1.25);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.06, 0);
controls.enableDamping = true;
controls.minDistance = 0.08; controls.maxDistance = 6;

let avatarObj = null, putterObj = null, ballObj = null;
function refreshAvatar() {
  if (avatarObj) { scene.remove(avatarObj); disposeTree(avatarObj); }
  avatarObj = avatarGroup(state.equip); scene.add(avatarObj);
  if (putterObj && putterObj.userData.skin !== skinKey()) refreshPutter();   // hand follows the skin tone
}
function refreshPutter() {
  if (putterObj) { scene.remove(putterObj); disposeTree(putterObj); }
  putterObj = putterGroup(state.putter, putterOpts(state.putter));
  putterObj.userData.skin = skinKey();
  placePutter(putterObj); putterObj.visible = $('#showExtras').checked; scene.add(putterObj);
}
function refreshBall() {
  if (ballObj) { scene.remove(ballObj); disposeTree(ballObj); }
  ballObj = placeBall(ballMesh(state.ball)); ballObj.visible = $('#showExtras').checked; scene.add(ballObj);
}
function resize() {
  const r = viewer.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
  if (avatarObj && !userMoved) focus(currentView, true);   // keep the framing when the window changes size
}
new ResizeObserver(resize).observe(viewer);

let tween = null, currentView = 'avatar', userMoved = false;
controls.addEventListener('start', () => { userMoved = true; tween = null; });
const VIEW_DIR = { avatar: [0.03, 0.03, 1], putter: [0.3, 0.1, 1], ball: [0.25, 0.2, 1] };
function viewBox(which) {
  const box = new THREE.Box3();
  const add = o => { if (o && o.visible) box.expandByObject(o); };
  if (which === 'avatar') { add(avatarObj); add(putterObj); add(ballObj); }
  else add(which === 'putter' ? putterObj : ballObj);
  if (box.isEmpty()) add(avatarObj);

// presets
const presetSel = $('#preset');
presetSel.append(new Option('Preset: Captain (screenshot)', 'captain'));
for (const p of META.presets) presetSel.append(new Option(`Preset: game #${p.id}${p.label ? ' ' + p.label : ''}`, 'g' + p.id));
function applyPreset(val) {
  const opts = val === 'captain' ? CAPTAIN : META.presets.find(p => 'g' + p.id === val).options;
  const r = equipFromOptions(opts);
  state.model = r.model; state.equip = r.equip;
  if (!availableCats().includes(state.cat)) state.cat = 'model';
  refreshAvatar(); renderPanel();
}
presetSel.onchange = () => applyPreset(presetSel.value);
// randomize (standard human avatar)
$('#random').onclick = () => {
  state.model = 'model_1';
  const byCat = {};
  for (const p of partsByModel.model_1) (byCat[p.cat] ||= []).push(p);
  const chance = { head: 1, eyes: 1, eyebrows: 0.85, eyelashes: 0.3, hair: 0.8, hat: 0.55, glasses: 0.45, beard: 0.35, makeup: 0.2, outfit: 0.9, accessories: 0.25 };
  const eq = {};
  for (const [cat, arr] of Object.entries(byCat)) {
    if (Math.random() > (chance[cat] ?? 0.3)) continue;
    const p = arr[Math.floor(Math.random() * arr.length)];
    const maxV = cat === 'head' ? Math.min(p.colors, 10) : p.colors;   // natural skin tones first
    eq[cat] = { part: p, variant: maxV > 1 ? Math.floor(Math.random() * maxV) : p.color };
  }
  state.equip = eq; refreshAvatar(); renderPanel();
};
$('#showExtras').onchange = e => { putterObj.visible = ballObj.visible = e.target.checked; };
$('#dlChar').onclick = () => {
  const root = new THREE.Group();
  root.add(avatarGroup(state.equip));
  if ($('#includeExtras').checked) {
    root.add(placePutter(putterGroup(state.putter, putterOpts(state.putter))));
    root.add(placeBall(ballMesh(state.ball)));
  }
  download(root, 'walkabout_character');
};

// ---------------------------------------------------------------- start
applyPreset('captain');
refreshPutter(); refreshBall();
resize();
focus('avatar', true);
$('#loading').remove();
window.__wmg = { state, META, meshesToColored, build3MF, buildOBJ, avatarGroup, putterGroup, ballMesh, camera, viewBox, get putterObj() { return putterObj; } };   // for debugging in the console

</script>
</body>
</html>
