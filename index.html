<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkabout Avatar Creator</title>
<style>
  :root {
    --bg: #eef2f6; --panel: #ffffff; --panel-2: #f5f7fa; --text: #1c2430; --muted: #6a7686;
    --line: #dde3ea; --accent: #1f7ae0; --accent-soft: #e3effd; --card: #f7f9fb; --shadow: 0 1px 3px rgba(20,30,50,.08);
    --sky-1: #bfe3ff; --sky-2: #f3f9ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --panel: #1a2029; --panel-2: #202833; --text: #e6ebf2; --muted: #93a0b2;
      --line: #2c3542; --accent: #4c9dff; --accent-soft: #1d3350; --card: #222a35; --shadow: none;
      --sky-1: #1e3550; --sky-2: #121821;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1a2029; --panel-2: #202833; --text: #e6ebf2; --muted: #93a0b2;
    --line: #2c3542; --accent: #4c9dff; --accent-soft: #1d3350; --card: #222a35; --shadow: none;
    --sky-1: #1e3550; --sky-2: #121821;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 440px; height: 100vh; }
  #viewer { position: relative; background: linear-gradient(180deg, var(--sky-1), var(--sky-2)); overflow: hidden; }
  #viewer canvas { display: block; width: 100%; height: 100%; }
  .bar { position: absolute; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .bar.top { top: 12px; }
  .bar.bottom { bottom: 12px; }
  h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: .2px; background: var(--panel);
    padding: 7px 12px; border-radius: 10px; box-shadow: var(--shadow); }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 12px; cursor: pointer; box-shadow: var(--shadow); }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 6px 10px; box-shadow: var(--shadow); cursor: pointer; user-select: none; }
  .spacer { flex: 1; }
  #panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-radius: 0; box-shadow: none; background: transparent; padding: 12px 8px;
    font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 4px; }
  #chips button { padding: 4px 10px; border-radius: 99px; font-size: 13px; box-shadow: none; background: var(--panel-2); }
  #chips button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #chips button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: middle; }
  #extras { padding: 6px 12px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #extras:empty { display: none; }
  #swatches { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 8px; }
  #swatches:empty { padding: 0; }
  #swatches .title { width: 100%; font-size: 12px; color: var(--muted); }
  .sw { width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--line); cursor: pointer; padding: 0; box-shadow: none; }
  .sw.active { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
  #grid { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 10px; align-content: start; }
  .card { position: relative; background: var(--card); border: 2px solid transparent; border-radius: 12px; padding: 6px 6px 8px;
    cursor: pointer; text-align: center; transition: border-color .1s; }
  .card:hover { border-color: var(--line); }
  .card.sel { border-color: var(--accent); background: var(--accent-soft); }
  .card .th { width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .card .ph { width: 38%; aspect-ratio: 1; border-radius: 50%; background: var(--line); opacity: .5; }
  .card .none { font-size: 34px; color: var(--muted); }
  .card .lb { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sb { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 15px; }
  .card .dl { position: absolute; top: 4px; right: 4px; padding: 3px 6px; font-size: 12px; line-height: 1; border-radius: 7px;
    opacity: 0; transition: opacity .1s; }
  .card:hover .dl, .card.sel .dl { opacity: 1; }
  @media (hover: none) { .card .dl { opacity: 1; } }
  .menu { position: relative; }
  .menu summary { list-style: none; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 12px; box-shadow: var(--shadow); user-select: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu[open] summary, .menu summary:hover { border-color: var(--accent); }
  .menu .pop { position: absolute; right: 0; bottom: calc(100% + 8px); width: 190px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .menu .pop label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .menu .pop-title { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .icon-btn, .menu summary.icon { display: inline-grid; place-items: center; width: 36px; height: 35px; padding: 0; }
  .menu summary.icon.with-label { display: inline-flex; width: auto; gap: 5px; padding: 0 10px; font-size: 12px; font-weight: 600; }
  .icon-btn svg, .menu svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .icon-btn svg .f, .menu svg .f { fill: currentColor; stroke: none; }
  .menu summary.primary { display: inline-flex; align-items: center; gap: 7px; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .menu summary.primary::after { content: '▾'; font-size: 11px; opacity: .85; }
  .menu .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .menu .opt { box-shadow: none; padding: 6px 9px; text-align: left; font-size: 13px; background: var(--panel-2); }
  .menu .opt.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .menu .pop > button:not(.opt) { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .menu .pop-note { font-size: 11.5px; color: var(--muted); }
  #camMenu .pop { width: 270px; }
  #presetMenu .pop { width: 240px; }
  .menu .list { display: flex; flex-direction: column; gap: 3px; max-height: min(360px, 55vh); overflow-y: auto; padding-right: 2px; }
  .btn-group { display: inline-flex; }
  .btn-group > :first-child, .btn-group > :first-child > summary { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .btn-group > :last-child, .btn-group > :last-child > summary { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .btn-group > :not(:first-child) { margin-left: -1px; }
  .btn-group > :hover, .btn-group > details[open] { position: relative; z-index: 1; }
  #dlMenu .pop { width: 240px; }
  .menu.down .pop { top: calc(100% + 8px); bottom: auto; left: 0; right: auto; width: 280px; }
  .menu .pop label.slider { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; font-size: 12.5px; }
  .menu .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .menu .slider output { color: var(--muted); font-variant-numeric: tabular-nums; }
  .menu .row { display: flex; gap: 6px; align-items: center; }
  .menu .row select { flex: 1; }
  .menu.down.right .pop { left: auto; right: 0; width: 170px; }
  #status { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); background: var(--panel); padding: 8px 14px;
    border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; font-size: 15px; color: var(--muted); }
  #loading .missing { max-width: 440px; padding: 0 16px; line-height: 1.5; color: var(--text); }
  #loading .missing b { font-size: 18px; }
  #loading .missing code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    #panel { border-left: 0; border-top: 1px solid var(--line); }
    #grid { max-height: 70vh; }
    h1 { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading models…</div>
<script>
  // pick the language before the (large) data bundle loads, so the loading message is already translated
  window.WMG_LANG = (() => {
    try { const s = localStorage.getItem('wmg.lang'); if (s === 'en' || s === 'de') return s; } catch {}
    return (navigator.languages || [navigator.language || 'en']).some(l => /^de\b/i.test(l)) ? 'de' : 'en';
  })();
  document.documentElement.lang = window.WMG_LANG;
  if (window.WMG_LANG === 'de') document.getElementById('loading').textContent = 'Modelle werden geladen…';
</script>
<div id="app">
  <section id="viewer">
    <div class="bar top">
      <h1 data-i18n="appTitle">Walkabout Avatar Creator</h1>
      <div class="btn-group">
        <details id="presetMenu" class="menu down">
          <summary class="icon" data-i18n-title="presetsTitle" title="Presets"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></summary>
          <div class="pop">
            <div class="pop-title" data-i18n="presetsTitle">Presets</div>
            <div class="list" id="presetList"></div>
          </div>
        </details>
        <button id="random" class="icon-btn" data-i18n-title="randomTitle" title="Random avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.4" class="f"/><circle cx="16" cy="8" r="1.4" class="f"/><circle cx="12" cy="12" r="1.4" class="f"/><circle cx="8" cy="16" r="1.4" class="f"/><circle cx="16" cy="16" r="1.4" class="f"/></svg></button>
      </div>
      <details id="camMenu" class="menu down">
        <summary class="icon" data-i18n-title="camTitle" title="Camera angle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></summary>
        <div class="pop">
          <div class="pop-title" data-i18n="camTitle">Camera angle</div>
          <div class="opts">
            <button class="opt" data-cam="auto" data-i18n="cam_auto">auto</button>
            <button class="opt" data-cam="front" data-i18n="cam_front">front</button>
            <button class="opt" data-cam="frontLeft" data-i18n="cam_frontLeft">frontLeft</button>
            <button class="opt" data-cam="frontRight" data-i18n="cam_frontRight">frontRight</button>
            <button class="opt" data-cam="left" data-i18n="cam_left">left</button>
            <button class="opt" data-cam="right" data-i18n="cam_right">right</button>
            <button class="opt" data-cam="back" data-i18n="cam_back">back</button>
            <button class="opt" data-cam="top" data-i18n="cam_top">top</button>
            <button class="opt" data-cam="low" data-i18n="cam_low">low</button>
            <button class="opt" data-cam="face" data-i18n="cam_face">face</button>
          </div>
          <button id="camApply" data-i18n-title="camApplyTitle" title="Snap back to the selected camera angle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5"/></svg><span data-i18n="camApply">Snap back</span></button>
        </div>
      </details>
      <details id="lightMenu" class="menu down">
        <summary class="icon" data-i18n-title="lighting" title="Lighting"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></summary>
                <div class="pop">

          <div id="lightSliders"></div>
          <label><input type="checkbox" id="lightFollow"> <span data-i18n="lightFollow">Light follows camera</span></label>
          <div class="row"><span class="pop-title" data-i18n="toneMapping">Tone mapping</span>
            <select id="lightTone"><option value="neutral" data-i18n="tone_neutral">Neutral</option><option value="agx">AgX</option><option value="aces" data-i18n="tone_aces">ACES filmic</option><option value="none" data-i18n="tone_none">None</option></select></div>
        </div>

        <div class="pop">

    <div id="status"></div>
    <div class="bar bottom">

        <div class="pop">

          <label><input type="radio" name="pngBg" value="default" checked> <span data-i18n="bgDefault">Default</span></label>
          <label><input type="radio" name="pngBg" value="white"> <span data-i18n="bgWhite">White</span></label>
          <label><input type="radio" name="pngBg" value="transparent"> <span data-i18n="bgTransparent">Transparent</span></label>
          <div class="pop-title" data-i18n="size">Size</div>
          <select id="pngScale"><option value="1" data-i18n="scale1">1× viewer</option><option value="2" selected data-i18n="scale2">2× viewer</option><option value="4" data-i18n="scale4">4× viewer</option></select>
          <button class="primary" id="pngSave" data-i18n="saveImage">Save image</button>
        </div>
      </details>
      <details id="dlMenu" class="menu">
        <summary class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-i18n="download">Download</span></summary>

          <div class="pop-title" data-i18n="formatTitle">Download format</div>

          <label><input type="checkbox" id="includeExtras"> <span data-i18n="includeExtras">Include putter &amp; ball</span></label>

        </div>
      </details>
    </div>
  </section>
  <aside id="panel">
    <div class="tabs">
      <button data-tab="avatar" class="active" data-i18n="tabAvatar">Avatar</button>
      <button data-tab="putter" data-i18n="tabPutter">Putter</button>
      <button data-tab="ball" data-i18n="tabBall">Ball</button>
    </div>
    <div id="chips"></div>
    <div id="extras"></div>
    <div id="swatches"></div>
    <div id="grid"></div>
  </aside>
</div>
<script src="data/bundle.js"></script>
<script>
  // without the extracted game data the creator can't start, so say how to get it instead of showing a broken page
  if (!window.WMG_META) {
    document.getElementById('loading').innerHTML = window.WMG_LANG === 'de'
      ? '<div class="missing"><b>Die Spieldaten fehlen noch.</b><p>Doppelklicke im Ordner des Editors auf <code>Extract game data.bat</code>. Danach öffnet sich der Editor von selbst.</p><p>Eine Schritt-für-Schritt-Anleitung steht in <code>README.de.md</code>.</p></div>'
      : '<div class="missing"><b>The game data is missing.</b><p>Double-click <code>Extract game data.bat</code> in the creator\'s folder. The creator opens on its own when it\'s done.</p><p>Step-by-step instructions are in <code>README.md</code>.</p></div>';
  }
</script>

  const opts = val === 'captain' ? CAPTAIN : META.presets.find(p => 'g' + p.id === val).options;
  const r = equipFromOptions(opts);
  state.model = r.model; state.equip = r.equip;
  if (!availableCats().includes(state.cat)) state.cat = 'model';
  state.preset = val; syncPresetMenu();
  refreshAvatar(); renderPanel();
}
// randomize (standard human avatar)
$('#random').onclick = () => {
  state.model = 'model_1';
  const byCat = {};
  for (const p of partsByModel.model_1) (byCat[p.cat] ||= []).push(p);
  const chance = { head: 1, eyes: 1, eyebrows: 0.85, eyelashes: 0.3, hair: 0.8, hat: 0.55, glasses: 0.45, beard: 0.35, makeup: 0.2, outfit: 0.9, accessories: 0.25 };
  const eq = {};
  for (const [cat, arr] of Object.entries(byCat)) {
    if (Math.random() > (chance[cat] ?? 0.3)) continue;
    const p = arr[Math.floor(Math.random() * arr.length)];
    const maxV = cat === 'head' ? Math.min(p.colors, 10) : p.colors;   // natural skin tones first
    eq[cat] = { part: p, variant: maxV > 1 ? Math.floor(Math.random() * maxV) : p.color };
  }
  state.equip = eq; state.preset = null; syncPresetMenu(); refreshAvatar(); renderPanel();
};
// camera menu: angle buttons + snap back; like the lighting panel it stays open until a click outside it
const closeMenus = () => document.querySelectorAll('details.menu').forEach(m => { m.open = false; });
function syncCamMenu() { document.querySelectorAll('#camMenu [data-cam]').forEach(b => b.classList.toggle('active', b.dataset.cam === state.cam)); }
document.querySelectorAll('#camMenu [data-cam]').forEach(b => b.onclick = () => { state.cam = b.dataset.cam; syncCamMenu(); focus(state.tab); });
syncCamMenu();
// lighting panel
const lightPreset = $('#lightPreset');
function buildLightPresetOptions() {
  lightPreset.replaceChildren(...Object.keys(LIGHT_PRESETS).map(k => new Option(t('lp_' + k), k)), new Option(t('lp_custom'), 'custom'));
}
buildLightPresetOptions();
const sliderEls = {};
for (const [k, min, max, step] of LIGHT_SLIDERS) {
  const wrap = el('label', 'slider'), inp = el('input'), out = el('output');
  Object.assign(inp, { type: 'range', min, max, step });
  inp.oninput = () => { light[k] = +inp.value; light.preset = 'custom'; syncLightUI(); applyLighting(); };
  const name = el('span', null, t('ls_' + k));
  wrap.append(name, out, inp); $('#lightSliders').append(wrap);
  sliderEls[k] = { inp, out, name };
}
function syncLightUI() {
  for (const [k, { inp, out }] of Object.entries(sliderEls)) {
    inp.value = light[k];
    out.textContent = k === 'az' || k === 'el' ? `${Math.round(light[k])}°` : (+light[k]).toFixed(2);
  }
  lightPreset.value = light.preset in LIGHT_PRESETS ? light.preset : 'custom';
  $('#lightFollow').checked = !!light.follow; $('#lightTone').value = light.tone;
}
function setLightPreset(k) { Object.assign(light, LIGHT_PRESETS[k], { preset: k }); syncLightUI(); applyLighting(); }
lightPreset.onchange = () => { if (lightPreset.value in LIGHT_PRESETS) setLightPreset(lightPreset.value); };
$('#lightReset').onclick = () => setLightPreset('studio');
$('#lightFollow').onchange = e => { light.follow = e.target.checked; light.preset = 'custom'; syncLightUI(); applyLighting(); };
$('#lightTone').onchange = e => { light.tone = e.target.value; light.preset = 'custom'; syncLightUI(); applyLighting(); };
syncLightUI();
// language selector (preselected from the saved choice or the browser language)
function setLanguage(l) {
  lang = l;
  try { localStorage.setItem('wmg.lang', l); } catch {}
  applyStaticI18n(); buildPresetOptions(); buildLightPresetOptions();
  for (const [k, s] of Object.entries(sliderEls)) s.name.textContent = t('ls_' + k);
  syncLightUI(); syncLangMenu(); renderPanel();
}
function syncLangMenu() {
  $('#langCode').textContent = lang.toUpperCase();
  document.querySelectorAll('#langMenu [data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}
document.querySelectorAll('#langMenu [data-lang]').forEach(b => b.onclick = () => { setLanguage(b.dataset.lang); closeMenus(); });
syncLangMenu();
applyStaticI18n();
$('#camApply').onclick = () => focus(state.tab);
// Save the current view as PNG: re-render at the chosen resolution and composite over the chosen background.
async function savePNG() {
  const bg = document.querySelector('input[name=pngBg]:checked').value;
  const r = viewer.getBoundingClientRect(), max = renderer.capabilities.maxTextureSize;
  const scale = Math.min(+$('#pngScale').value, max / r.width, max / r.height);
  const w = Math.round(r.width * scale), h = Math.round(r.height * scale);
  const ratio = renderer.getPixelRatio();
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const ctx = out.getContext('2d');
  if (bg !== 'transparent') {
    if (bg === 'white') ctx.fillStyle = '#ffffff';
    else {
      const css = getComputedStyle(document.documentElement), g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, css.getPropertyValue('--sky-1').trim()); g.addColorStop(1, css.getPropertyValue('--sky-2').trim());
      ctx.fillStyle = g;
    }
    ctx.fillRect(0, 0, w, h);
  }
  try {
    renderer.setPixelRatio(1); renderer.setSize(w, h, false);
    updateLightRig(); renderer.render(scene, camera);
    ctx.drawImage(renderer.domElement, 0, 0);   // same task as the render, so the drawing buffer is still valid
  } finally {
    renderer.setPixelRatio(ratio); resize(); renderer.render(scene, camera);
  }
  const blob = await new Promise(res => out.toBlob(res, 'image/png'));
  const a = el('a'); a.href = URL.createObjectURL(blob);
  a.download = `walkabout_${state.tab}_${state.cam}_${bg}.png`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  $('#pngMenu').open = false;
}
$('#pngSave').onclick = () => savePNG().catch(err => { console.error(err); showStatus(t('imageFailed', { msg: err.message })); setTimeout(() => showStatus(''), 4000); });
document.addEventListener('pointerdown', e => { for (const m of document.querySelectorAll('details.menu')) if (!m.contains(e.target)) m.open = false; });
// keep popups inside the viewer (it clips overflow): shift them sideways when they open near an edge
document.querySelectorAll('details.menu').forEach(m => m.addEventListener('toggle', () => {
  const pop = m.querySelector('.pop');
  pop.style.transform = '';
  if (!m.open) return;
  const vr = viewer.getBoundingClientRect(), pr = pop.getBoundingClientRect();
  let dx = 0;
  if (pr.right > vr.right - 8) dx = vr.right - 8 - pr.right;
  if (pr.left + dx < vr.left + 8) dx = vr.left + 8 - pr.left;
  if (dx) pop.style.transform = `translateX(${dx}px)`;
}));
$('#showExtras').onchange = e => { putterObj.visible = ballObj.visible = e.target.checked; };
$('#dlChar').onclick = () => {
  closeMenus();
  const root = new THREE.Group();
  root.add(avatarGroup(state.equip));
  if ($('#includeExtras').checked) {
    root.add(placePutter(putterGroup(state.putter, putterOpts(state.putter))));
    root.add(placeBall(ballMesh(state.ball)));
  }
  download(root, 'walkabout_character');
};

// ---------------------------------------------------------------- start
applyPreset('captain');
refreshPutter(); refreshBall();
resize();
focus('avatar', true);
$('#loading').remove();
window.__wmg = { light, setLightPreset, rig, renderer, savePNG, focus, state, META, meshesToColored, build3MF, buildOBJ, avatarGroup, putterGroup, ballMesh, camera, viewBox, get putterObj() { return putterObj; } };   // for debugging in the console

</script>
